# tmux strips OSC 8 unless the outer terminal advertises Hls
set -as terminal-features ',*:hyperlinks'
set -g allow-passthrough on

# CSI-u so Shift+Enter reaches agents in panes
set -s extended-keys on
# extkeys makes tmux request CSI-u from the outer terminal; without it extended-keys never fires
set -as terminal-features ',*:extkeys'
set -s extended-keys-format csi-u

# Scroll tmux history with the mouse or trackpad
set -g mouse on
set -g set-clipboard on

# Hint-and-copy (brew install tmux-fingers): prefix+f; hint copies, Shift+hint copies and pastes.
set -g @fingers-key f
set -g @fingers-main-action ':copy:'
set -g @fingers-shift-action ':paste:'
set -g @fingers-pattern-0 '\b[A-Za-z][A-Za-z0-9]*_[A-Za-z0-9_]+\b'
if 'command -v tmux-fingers >/dev/null' "run 'tmux-fingers load-config'" "if '[ -x ~/.tmux/plugins/tmux-fingers/tmux-fingers.tmux ]' \"run '~/.tmux/plugins/tmux-fingers/tmux-fingers.tmux'\""

# Terminal-independent replacements for the WezTerm pane keys
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g history-limit 50000
bind c new-window -c '#{pane_current_path}'
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind r source-file ~/.tmux.conf \; display 'tmux.conf reloaded'
